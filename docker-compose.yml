version: '3'

services:
  # claude server
  claude-ssh:
    build: .
    container_name: claude_workspace
    restart: unless-stopped
    ports:
      - "2223:22" # Accessible via host_ip:2223
    stdin_open: true
    tty: true

  # 1. Guacamole Proxy Daemon
  guacd:
    image: guacamole/guacd:1.5.5
    container_name: guacamole_guacd
    restart: always

  # 2. PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: guacamole_postgres
    restart: always
    environment:
      POSTGRES_DB: guacamole_db
      POSTGRES_USER: guacamole_user
      POSTGRES_PASSWORD: ChooseAStrongPassword123! # Change this in production!
    volumes:
      - ./init:/docker-entrypoint-initdb.d
      - guac_db:/var/lib/postgresql/data         # Named volume (can be wiped with -v)

  # 3. Guacamole Web Application
  guacamole:
    image: guacamole/guacamole:1.5.5
    container_name: guacamole_web
    restart: always
    # Removed public port mapping "8081:8080" to prevent bypassing the proxy.
    # Caddy will communicate with it internally over the Docker network on port 8080.
    expose:
      - "8080"
    environment:
      - GUACD_HOSTNAME=guacd
      - GUACD_PORT=4822
      - POSTGRESQL_HOSTNAME=postgres
      - POSTGRESQL_DATABASE=guacamole_db
      - POSTGRESQL_USER=guacamole_user
      - POSTGRESQL_PASSWORD=ChooseAStrongPassword123!
    depends_on:
      - guacd
      - postgres

  # 4. Caddy Reverse Proxy
  caddy:
    image: caddy:2-alpine
    container_name: caddy_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # Optional: Enables HTTP/3 support
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - guacamole

volumes:
  guac_db:
  caddy_data:
  caddy_config:
